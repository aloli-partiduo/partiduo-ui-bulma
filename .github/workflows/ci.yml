# SPDX-License-Identifier: AGPL-3.0-or-later
#
# CI de partiduo-ui-bulma : format, Ameba, garde-fou d'interface (ADR-005 D3 :
# seul Partiduo::Api est cité), aucune mention du logiciel d'origine, fraîcheur
# des paquets Opal et de la planche d'icônes, specs sur PostgreSQL.
name: CI

on:
  push:
    branches: [development, production]
  pull_request:

env:
  CRYSTAL_VERSION: "1.19.1"
  SKIP_MARTEN_CLI_PRECOMPILATION: "1"

jobs:
  qualite:
    name: Format, Ameba, garde-fous
    runs-on: ubuntu-latest
    container: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Verrou sans dépendance « path » (exigé par les ports FreeBSD)
        run: "! grep -q 'path:' shard.lock"
      - name: Aucune mention du logiciel d'origine hors *.adoc et *.md
        # Le motif est coupé en deux pour que ce fichier ne se trouve pas lui-même.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -il "noa""lyss" -- . ':!*.adoc' ':!*.md'; then
            echo "::error::Nom du logiciel d'origine trouvé dans le code (autorisé seulement dans *.adoc et *.md)."
            exit 1
          fi
      - name: Format
        run: crystal tool format --check src spec config scripts manage.cr
      - name: Shards
        run: shards install
      - name: Ameba
        run: mkdir -p bin && crystal build lib/ameba/bin/ameba.cr -o bin/ameba && bin/ameba
      - name: Garde-fou ADR-005 D3 (l'interface ne cite que Partiduo::Api)
        run: crystal run scripts/api_boundary.cr -- src config spec scripts manage.cr
      - name: Planche d'icônes à jour
        run: crystal run scripts/icon_sprite.cr -- --check

  opal:
    name: Paquets Opal à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Paquets Opal versionnés identiques aux sources
        run: bundle exec scripts/opal-build --check

  specs:
    name: Specs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: partiduo
          POSTGRES_PASSWORD: partiduo
          POSTGRES_DB: partiduo_test
        options: >-
          --health-cmd "pg_isready -U partiduo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # En CI seulement, PostgreSQL est un service joignable en TCP.
      DATABASE_URL: postgres://partiduo:partiduo@localhost:5432/partiduo_test
    steps:
      - uses: actions/checkout@v4
      - name: Mémoire d'échange (la compilation des specs dépasse 6 Go)
        run: |
          sudo fallocate -l 12G /swap-ci && sudo chmod 600 /swap-ci
          sudo mkswap /swap-ci && sudo swapon /swap-ci && free -h
      - name: Index des paquets à jour (install-crystal installe sans le rafraîchir)
        run: sudo apt-get update
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.19.1
      - name: Bibliothèques de compilation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libyaml-dev libssl-dev libgmp-dev libxml2-dev libpcre2-dev lld
      - name: Moteur JavaScript autonome (JavaScriptCore, sans Node) pour les specs Opal
        run: |
          sudo apt-get update
          # Le nom du paquet qui fournit jsc varie selon la version d'Ubuntu.
          for pkg in libjavascriptcoregtk-6.0-bin libjavascriptcoregtk-4.1-bin libjavascriptcoregtk-4.0-bin; do
            if sudo apt-get install -y --no-install-recommends "$pkg"; then break; fi
          done
          engine="$(command -v jsc || find /usr/bin /usr/lib -type f -name 'jsc*' -perm -u+x 2>/dev/null | head -n 1 || true)"
          if [ -n "$engine" ]; then
            echo "PARTIDUO_JS_ENGINE=$engine" >> "$GITHUB_ENV"
          else
            apt-cache search javascriptcore || true
            echo "::warning::Aucun moteur jsc trouvé : les specs Opal seront en attente."
          fi
      - name: Shards
        run: shards install
      - name: Specs
        run: crystal spec --order random --no-debug --threads 1 --link-flags=-fuse-ld=lld
